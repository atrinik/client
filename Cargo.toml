[workspace]
members = [
  "crates/atrinik-actions",
  "crates/atrinik-client",
  "crates/atrinik-config-cache",
  "crates/atrinik-platform",
  "crates/atrinik-protocol-adapter",
  "crates/atrinik-scene-adapter",
  "crates/atrinik-session",
  "crates/atrinik-testkit",
  "crates/atrinik-ui-model",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/atrinik/client"

[workspace.dependencies]
atrinik-actions = { path = "crates/atrinik-actions", version = "=0.1.0" }
atrinik-config-cache = { path = "crates/atrinik-config-cache", version = "=0.1.0" }
atrinik-platform = { path = "crates/atrinik-platform", version = "=0.1.0" }
atrinik-protocol-adapter = { path = "crates/atrinik-protocol-adapter", version = "=0.1.0" }
atrinik-scene-adapter = { path = "crates/atrinik-scene-adapter", version = "=0.1.0" }
atrinik-session = { path = "crates/atrinik-session", version = "=0.1.0" }
atrinik-testkit = { path = "crates/atrinik-testkit", version = "=0.1.0" }
atrinik-ui-model = { path = "crates/atrinik-ui-model", version = "=0.1.0" }
sdl3 = { version = "=0.18.4", default-features = false, features = ["build-from-source-static"] }
sha2 = "=0.10.9"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
